name: Validate

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  application:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm test:template:adoption
      - run: pnpm template:adoption:check
      - run: pnpm template:capabilities:check --base "origin/${{ github.base_ref || 'main' }}"
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:web

  infrastructure:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm infra:config

  database:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # El paquete npm de Supabase no extrae su binario nativo de forma
      # confiable en runners Linux persistentes; usamos el release oficial.
      - name: Instalar Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
          supabase --version
      - run: supabase start
      # El runner self-hosted mantiene el stack de Supabase corriendo entre
      # ejecuciones (no es efímero como un runner de GitHub). `supabase
      # start` sobre un stack ya iniciado no vuelve a aplicar migraciones
      # nuevas, así que los tests podían correr contra un esquema
      # desactualizado (main quedó roto tras mergear los PR #4 y #5 por
      # "relation eventos_membresia does not exist" / función inexistente,
      # pese a que la migración sí estaba en el repo).
      #
      # `supabase db reset`/`stop --no-backup` + `start` no sirven acá:
      # necesitan conectarse por 127.0.0.1 para reaplicar migraciones, y
      # desde el contenedor del job eso no llega a los contenedores de
      # Supabase (hay que pasar por host.docker.internal, igual que en
      # test:db:ci). Apuntar `db reset --db-url` a host.docker.internal sí
      # conecta, pero el CLI lo trata como una base "remota" — probado a
      # mano, ese modo no reinicializa el esquema con la misma
      # confiabilidad y dejó políticas de RLS mal resueltas (visibilidad de
      # `clientes` incorrecta).
      #
      # db:reset:ci (scripts/reset-db-ci.mjs) hace lo mismo a mano con psql
      # por host.docker.internal: dropea `public`/`private` y reaplica cada
      # migración + seed.sql, sin pasar por el CLI para esta parte.
      - run: pnpm db:reset:ci
      # test:db (no test:db:ci) usa 127.0.0.1, que en el runner self-hosted
      # en Docker apunta al propio contenedor, no al host donde corre
      # Supabase. test:db:ci se conecta por host.docker.internal en su
      # lugar. Ver docs/deployment.md.
      - run: pnpm test:db:ci
