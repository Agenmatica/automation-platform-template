name: Validate

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  application:
    runs-on: [self-hosted, estudio-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:web

  infrastructure:
    runs-on: [self-hosted, estudio-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm infra:config

  database:
    runs-on: [self-hosted, estudio-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      # test:db (no test:db:ci) usa 127.0.0.1, que en el runner self-hosted
      # en Docker apunta al propio contenedor, no al host donde corre
      # Supabase. test:db:ci se conecta por host.docker.internal en su
      # lugar. Ver docs/deployment.md.
      - run: pnpm test:db:ci
