name: Validate

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  application:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:web

  infrastructure:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm infra:config

  database:
    runs-on: [self-hosted, platform-local]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      # El runner self-hosted mantiene el stack de Supabase corriendo entre
      # ejecuciones (no es efímero como un runner de GitHub). `supabase
      # start` sobre un stack ya iniciado no vuelve a aplicar migraciones
      # nuevas, así que sin este reset los tests corren contra un esquema
      # desactualizado (main quedó roto tras mergear los PR #4 y #5 por
      # "relation eventos_membresia does not exist" / función inexistente,
      # pese a que la migración sí estaba en el repo). `db reset` reaplica
      # todas las migraciones + seed.sql antes de cada corrida.
      # --db-url: igual que test:db:ci, 127.0.0.1 en el runner self-hosted
      # en Docker apunta al propio contenedor del job, no al host donde
      # corre Supabase — hay que resolverlo por host.docker.internal.
      # --yes: con --db-url el CLI trata el destino como una base remota y
      # pide confirmación interactiva ("¿reiniciar la base remota?"), que en
      # CI no hay quién conteste.
      - run: pnpm supabase db reset --db-url "postgresql://postgres:postgres@host.docker.internal:5434/postgres" --yes
      # test:db (no test:db:ci) usa 127.0.0.1, que en el runner self-hosted
      # en Docker apunta al propio contenedor, no al host donde corre
      # Supabase. test:db:ci se conecta por host.docker.internal en su
      # lugar. Ver docs/deployment.md.
      - run: pnpm test:db:ci
