name: estudio-automation-runner-dev

services:
  runner:
    build: .
    deploy:
      replicas: 3
    environment:
      GH_PAT: ${GH_RUNNER_PAT}
      RUNNER_REPO: Agenmatica/estudio-automation
      RUNNER_NAME: estudio-automation-docker
      RUNNER_LABELS: self-hosted,estudio-local
    volumes:
      # Docker-fuera-de-Docker: mismo patron que infra/kestra/compose.yaml.
      # Los comandos docker que corren los jobs (docker compose, supabase
      # start) terminan controlando el Docker del host, no uno anidado.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
