name: automation-platform-template-kestra-dev

services:
  kestra-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:-kestra-local}
    volumes:
      - kestra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kestra:
    image: kestra/kestra:v1.3.35
    user: root
    command: server standalone --worker-thread=32
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD:-kestra-local}
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          server:
            basic-auth:
              enabled: true
              username: ${KESTRA_BASIC_AUTH_USERNAME:-admin@local.test}
              password: ${KESTRA_BASIC_AUTH_PASSWORD:-change-me-local}
      # Leídas por el flow infra/kestra/flows/respaldo-postgres.yml (spec 011)
      # vía {{ envs.kestra_backups_db_password }} / {{ envs.kestra_backups_db_url }} /
      # {{ envs.kestra_backups_pgdump_url }}.
      # Prefijo ENV_ obligatorio: desde Kestra 0.23 es el único prefijo que
      # {{ envs.* }} expone por defecto (kestra.variables.env-vars-prefix) —
      # KESTRA_BACKUPS_DB_PASSWORD sigue siendo el nombre "humano" en
      # .env.example, este es solo el nombre con el que llega al proceso.
      ENV_KESTRA_BACKUPS_DB_PASSWORD: ${KESTRA_BACKUPS_DB_PASSWORD:-change-me-local}
      ENV_KESTRA_BACKUPS_DB_URL: ${KESTRA_BACKUPS_DB_URL:-jdbc:postgresql://host.docker.internal:5434/postgres}
      ENV_KESTRA_BACKUPS_PGDUMP_URL: ${KESTRA_BACKUPS_PGDUMP_URL:-postgres://postgres:postgres@host.docker.internal:5434/postgres}
      # Leídas por infra/kestra/flows/plantilla-generico.yml/plantilla-dedicado.yml
      # (spec 013) vía {{ envs.kestra_orquestacion_db_password }} /
      # {{ envs.kestra_orquestacion_db_url }} — mismo motivo de prefijo ENV_
      # que las de arriba.
      ENV_KESTRA_ORQUESTACION_DB_PASSWORD: ${KESTRA_ORQUESTACION_DB_PASSWORD:-change-me-local}
      ENV_KESTRA_ORQUESTACION_DB_URL: ${KESTRA_ORQUESTACION_DB_URL:-jdbc:postgresql://host.docker.internal:5434/postgres}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - kestra-data:/app/storage
      - kestra-work:/tmp/kestra-wd
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kestra-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kestra-postgres-data:
  kestra-data:
  kestra-work:
