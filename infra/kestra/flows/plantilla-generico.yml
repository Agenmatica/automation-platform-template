# Plantilla generica de spec 013. Cada conector real la copia y cambia
# id/namespace/imagen; el nombre resultante sigue <producto>.<conector>.
id: plantilla-generico
namespace: platform.orquestacion
description: "Despacha en paralelo un worker por cada organizacion elegible."
inputs:
  - id: sistema_externo
    type: STRING
  - id: imagen
    type: STRING
tasks:
  # Aplica estado=activa y exclusiones dedicadas sin SELECT de tablas a Kestra.
  - id: organizaciones_activas
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ envs.kestra_orquestacion_db_url }}"
    username: kestra_orquestacion
    password: "{{ envs.kestra_orquestacion_db_password }}"
    fetchType: FETCH
    sql: select organizacion_id from private.organizaciones_activas_para_conector(:sistema_externo);
    parameters:
      sistema_externo: "{{ inputs.sistema_externo }}"
  # Kestra 1.3.35 deserializa concurrencyLimit antes de evaluar expresiones:
  # renderizar-flow.ps1 sustituye este literal al importar el flow desde la
  # variable KESTRA_ORQUESTACION_CONCURRENCIA del entorno.
  - id: despachar_organizaciones
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.organizaciones_activas.rows }}"
    concurrencyLimit: 10
    # Una organizacion fallida se alerta en el handler local sin cancelar las
    # iteraciones de las demas (SC-001).
    allowFailure: true
    tasks:
      - id: resolver_despacho
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ envs.kestra_orquestacion_db_url }}"
        username: kestra_orquestacion
        password: "{{ envs.kestra_orquestacion_db_password }}"
        fetchType: FETCH_ONE
        sql: select * from private.datos_despacho_conexion(CAST(:organizacion_id AS uuid), :sistema_externo);
        parameters:
          organizacion_id: "{{ fromJson(taskrun.value).organizacion_id }}"
          sistema_externo: "{{ inputs.sistema_externo }}"
      - id: ejecutar_despacho
        type: io.kestra.plugin.core.flow.Sequential
        tasks:
          - id: despacho_ssh
            type: io.kestra.plugin.fs.ssh.Command
            host: "{{ outputs.resolver_despacho[parent.taskrun.value].row.host }}"
            port: "{{ outputs.resolver_despacho[parent.taskrun.value].row.puerto_ssh }}"
            username: "{{ outputs.resolver_despacho[parent.taskrun.value].row.usuario_ssh }}"
            authMethod: PUBLIC_KEY
            privateKey: "{{ secret('ORQUESTACION_SSH_PRIVATE_KEY') }}"
            timeout: PT30M
            retry:
              type: exponential
              maxAttempts: 3
              interval: PT30S
              maxInterval: PT2M
            commands:
              - docker image inspect {{ inputs.imagen }} >/dev/null 2>&1 || docker pull {{ inputs.imagen }}
              - |
                set -a
                . /opt/automation-platform/worker.env
                set +a
                SISTEMA_EXTERNO="{{ inputs.sistema_externo }}"
                WORKER_NETWORK_ESPERADA="worker-egress-$SISTEMA_EXTERNO"
                case "$SISTEMA_EXTERNO" in fixture-*) WORKER_NETWORK_ESPERADA=bridge ;; esac
                [ "$WORKER_NETWORK" = "$WORKER_NETWORK_ESPERADA" ] || { echo 'Red de egress no autorizada' >&2; exit 64; }
                docker run --rm \
                  --read-only \
                  --tmpfs /tmp:rw,noexec,nosuid,size=64m \
                  --cap-drop=ALL \
                  --security-opt=no-new-privileges:true \
                  --cpus "${WORKER_CPUS:-1}" \
                  --memory "${WORKER_MEMORY:-512m}" \
                  --network "${WORKER_NETWORK:?Debe configurarse una red con egress allowlist}" \
                  --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER --env PGPASSWORD \
                  -e ORGANIZACION_ID="{{ fromJson(parent.taskrun.value).organizacion_id }}" \
                  -e SISTEMA_EXTERNO="{{ inputs.sistema_externo }}" \
                  -e CONEXION_ID="{{ outputs.resolver_despacho[parent.taskrun.value].row.conexion_id }}" \
                  {{ inputs.imagen }}
          - id: marcar_conexion_activa
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            sql: select private.marcar_conexion_activa(CAST(:conexion_id AS uuid));
            parameters:
              conexion_id: "{{ outputs.resolver_despacho[parent.taskrun.value].row.conexion_id }}"
        errors:
          # errorLogs() solo puede evaluarse en una tarea que corre en un
          # Worker (no en el condition de un Flowable como If, que lo evalua
          # el executor) -- de ahi la tarea intermedia detectar_tipo_falla.
          # errorLogs() devuelve una lista de entradas estructuradas, no texto
          # concatenado, asi que "contains" sobre la lista nunca matchea un
          # substring: hay que unir los mensajes antes de buscar la marca.
          - id: detectar_tipo_falla
            type: io.kestra.plugin.core.debug.Return
            format: "{% for log in errorLogs() %}{{ log.message }}\n{% endfor %}"
          - id: clasificar_y_alertar
            type: io.kestra.plugin.core.flow.If
            # Solo se inspecciona la marca contractual del worker para elegir
            # tipo; errorLogs() nunca se transmite ni se persiste como motivo.
            condition: "{{ outputs.detectar_tipo_falla.value contains 'CREDENCIAL_INVALIDA:' }}"
            then:
              - id: alertar_credencial
                type: io.kestra.plugin.core.flow.Subflow
                namespace: platform.alertas
                flowId: alertas
                wait: true
                transmitFailed: false
                inputs:
                  tipo: credencial
                  organizacion_id: "{{ fromJson(parent.taskrun.value).organizacion_id }}"
                  conexion_id: "{{ outputs.resolver_despacho[parent.taskrun.value].row.conexion_id }}"
                  motivo_sanitizado: "CREDENCIAL_INVALIDA:{{ outputs.resolver_despacho[parent.taskrun.value].row.conexion_id }}"
            else:
              - id: alertar_tecnica
                type: io.kestra.plugin.core.flow.Subflow
                namespace: platform.alertas
                flowId: alertas
                wait: true
                transmitFailed: false
                inputs:
                  tipo: tecnica
                  organizacion_id: "{{ fromJson(parent.taskrun.value).organizacion_id }}"
                  conexion_id: "{{ outputs.resolver_despacho[parent.taskrun.value].row.conexion_id }}"
                  motivo_sanitizado: FALLA_TECNICA_SANITIZADA
