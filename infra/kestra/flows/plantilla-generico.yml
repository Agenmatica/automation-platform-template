# Plantilla generica de spec 013. Cada conector real la copia y cambia
# id/namespace/imagen; el nombre resultante sigue <producto>.<conector>.
id: plantilla-generico
namespace: platform.orquestacion
description: "Despacha en paralelo un worker por cada organizacion elegible."
inputs:
  - id: sistema_externo
    type: STRING
  - id: imagen
    type: STRING
tasks:
  # Aplica estado=activa y exclusiones dedicadas sin SELECT de tablas a Kestra.
  - id: organizaciones_activas
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ envs.kestra_orquestacion_db_url }}"
    username: kestra_orquestacion
    password: "{{ envs.kestra_orquestacion_db_password }}"
    fetchType: FETCH
    sql: select organizacion_id from private.organizaciones_activas_para_conector(:sistema_externo);
    parameters:
      sistema_externo: "{{ inputs.sistema_externo }}"
  # Kestra 1.3.35 deserializa concurrencyLimit antes de evaluar expresiones:
  # renderizar-flow.ps1 sustituye este literal al importar el flow desde la
  # variable KESTRA_ORQUESTACION_CONCURRENCIA del entorno.
  - id: despachar_organizaciones
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.organizaciones_activas.rows }}"
    concurrencyLimit: 10
    # Una organizacion fallida se alerta en el handler local sin cancelar las
    # iteraciones de las demas (SC-001).
    allowFailure: true
    tasks:
      - id: resolver_despacho
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ envs.kestra_orquestacion_db_url }}"
        username: kestra_orquestacion
        password: "{{ envs.kestra_orquestacion_db_password }}"
        fetchType: FETCH_ONE
        sql: select * from private.datos_despacho_conexion(CAST(:organizacion_id AS uuid), :sistema_externo);
        parameters:
          organizacion_id: "{{ fromJson(taskrun.value).organizacion_id }}"
          sistema_externo: "{{ inputs.sistema_externo }}"
      - id: obtener_credencial_servidor
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ envs.kestra_orquestacion_db_url }}"
        username: kestra_orquestacion
        password: "{{ envs.kestra_orquestacion_db_password }}"
        fetchType: FETCH_ONE
        sql: select public.obtener_credencial_servidor(CAST(:organizacion_id AS uuid)) as credencial;
        parameters:
          organizacion_id: "{{ fromJson(taskrun.value).organizacion_id }}"
      - id: obtener_credencial_conexion
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ envs.kestra_orquestacion_db_url }}"
        username: kestra_orquestacion
        password: "{{ envs.kestra_orquestacion_db_password }}"
        fetchType: FETCH_ONE
        sql: select public.obtener_credencial_conexion(CAST(:conexion_id AS uuid)) as credencial;
        parameters:
          conexion_id: "{{ outputs.resolver_despacho[taskrun.value].row.conexion_id }}"
      - id: ejecutar_despacho
        type: io.kestra.plugin.core.flow.Sequential
        tasks:
          - id: despacho_ssh
            type: io.kestra.plugin.fs.ssh.Command
            host: "{{ outputs.resolver_despacho[taskrun.value].row.host }}"
            port: "{{ outputs.resolver_despacho[taskrun.value].row.puerto_ssh }}"
            username: "{{ outputs.resolver_despacho[taskrun.value].row.usuario_ssh }}"
            password: "{{ outputs.obtener_credencial_servidor[taskrun.value].row.credencial }}"
            retry:
              type: exponential
              maxAttempts: 3
              interval: PT30S
              maxInterval: PT2M
            commands:
              - docker pull {{ inputs.imagen }}
              - |
                docker run --rm \
                  -e ORGANIZACION_ID="{{ fromJson(taskrun.value).organizacion_id }}" \
                  -e SISTEMA_EXTERNO="{{ inputs.sistema_externo }}" \
                  -e CONEXION_ID="{{ outputs.resolver_despacho[taskrun.value].row.conexion_id }}" \
                  -e CREDENCIAL="{{ outputs.obtener_credencial_conexion[taskrun.value].row.credencial }}" \
                  {{ inputs.imagen }}
          - id: marcar_conexion_activa
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ envs.kestra_orquestacion_db_url }}"
            username: kestra_orquestacion
            password: "{{ envs.kestra_orquestacion_db_password }}"
            sql: select private.marcar_conexion_activa(CAST(:conexion_id AS uuid));
            parameters:
              conexion_id: "{{ outputs.resolver_despacho[taskrun.value].row.conexion_id }}"
        errors:
          - id: clasificar_y_alertar
            type: io.kestra.plugin.core.flow.If
            condition: "{{ errorLogs() contains 'CREDENCIAL_INVALIDA:' }}"
            then:
              - id: marcar_credencial_invalida
                type: io.kestra.plugin.jdbc.postgresql.Query
                url: "{{ envs.kestra_orquestacion_db_url }}"
                username: kestra_orquestacion
                password: "{{ envs.kestra_orquestacion_db_password }}"
                sql: select private.marcar_conexion_credencial_invalida(CAST(:conexion_id AS uuid), :motivo);
                parameters:
                  conexion_id: "{{ outputs.resolver_despacho[parent.taskrun.value].row.conexion_id }}"
                  motivo: "{{ errorLogs() }}"
              - id: alertar_credencial
                type: io.kestra.plugin.core.flow.Subflow
                namespace: platform.alertas
                flowId: alertas
                wait: true
                transmitFailed: false
                inputs:
                  tipo: credencial
                  organizacion_id: "{{ fromJson(parent.taskrun.value).organizacion_id }}"
                  conexion_id: "{{ outputs.resolver_despacho[parent.taskrun.value].row.conexion_id }}"
                  motivo: "{{ errorLogs() }}"
            else:
              - id: alertar_tecnica
                type: io.kestra.plugin.core.flow.Subflow
                namespace: platform.alertas
                flowId: alertas
                wait: true
                transmitFailed: false
                inputs:
                  tipo: tecnica
                  organizacion_id: "{{ fromJson(parent.taskrun.value).organizacion_id }}"
                  conexion_id: "{{ outputs.resolver_despacho[parent.taskrun.value].row.conexion_id }}"
                  motivo: "{{ errorLogs() }}"
